[Font]

## Put your own NanumGothic.ttf in:
## BepInEx\plugins\PAWNShift.KoreanFontFallback\
FontFile = NanumGothic.ttf

[Behaviour]

## false: keep the original game font and use Korean font only as fallback.
## true: force every TMP text to use NanumGothic.
ForceReplaceAll = false

## Usually keep false.
SetAsDefaultTMPFont = false

## Re-apply to UI/font assets loaded later.
ScanIntervalSeconds = 1
